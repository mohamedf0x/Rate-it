# New, standalone server block for rate.aggarha.com — proposed subdomain, confirm
# before wiring DNS. Does not modify any existing server block (aggarha.com,
# fops-dashboard, vulpesarena) — drop this in as its own file, e.g.
# /etc/nginx/sites-available/rate-it.conf, then symlink into sites-enabled and
# `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name rate.aggarha.com;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After this is live: certbot --nginx -d rate.aggarha.com
# (issues its own cert, does not touch existing certs for other subdomains)
